spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.address=127.0.0.1
server.forward-headers-strategy=none
server.max-http-request-header-size=8192B
server.tomcat.connection-timeout=10s
spring.security.filter.dispatcher-types=request,error,async,forward,include
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
spring.jmx.enabled=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.web.error.whitelabel.enabled=false
logging.level.root=INFO
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false
